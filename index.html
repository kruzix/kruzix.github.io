<script>
(function(){
  const btn=document.getElementById('themeToggle');
  const saved=localStorage.getItem('kruzix-theme');
  if(saved==='light') document.body.classList.add('light');
  function sync(){
    const light=document.body.classList.contains('light');
    btn.textContent=light?'☀':'☾';
    btn.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');
  }
  sync();
  btn.addEventListener('click',()=>{
    document.body.classList.toggle('light');
    localStorage.setItem('kruzix-theme',document.body.classList.contains('light')?'light':'dark');
    sync();
  });
})();
</script>

/* Quiet lavender pollen following the cursor. */
#pollen{position:fixed;left:0;top:0;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:9999;opacity:0;background:#d9b5ff;box-shadow:0 0 7px #d9b5ff,0 0 16px rgba(185,138,255,.65);transform:translate(-50%,-50%);transition:opacity .25s ease}
#pollen:before,#pollen:after{content:"";position:absolute;border-radius:50%;background:#c99aff;opacity:.6}.pollen:before{width:3px;height:3px;left:-7px;top:3px}.pollen:after{width:2px;height:2px;right:-6px;top:-5px}
.tilt-card{transform-style:preserve-3d;will-change:transform;transition:transform .16s ease,box-shadow .25s ease}.tilt-card:hover{box-shadow:0 28px 75px rgba(0,0,0,.38),0 0 35px rgba(177,126,242,.09)}
</style>
<div id="pollen" aria-hidden="true"></div>
<script>
(function(){
 const pollen=document.getElementById('pollen'); let tx=0,ty=0,x=0,y=0;
 window.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;pollen.style.opacity='.72';});
 window.addEventListener('pointerleave',()=>pollen.style.opacity='0');
 function follow(){x+=(tx-x)*.18;y+=(ty-y)*.18;pollen.style.left=x+'px';pollen.style.top=y+'px';requestAnimationFrame(follow)} follow();
 const cards=[...document.querySelectorAll('.card,.profile,.hero-frame')];
 cards.forEach(card=>{card.classList.add('tilt-card');card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5,max=3.2;card.style.transform=`perspective(900px) rotateX(${-py*max}deg) rotateY(${px*max}deg) translateY(-2px)`});card.addEventListener('pointerleave',()=>card.style.transform='perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0)')});
})();
</script>

<style>
/* Маленькие сиреневые бабочки по бокам KRUZIX в верхней навигации */
.nav-butterfly{
  position:relative;
  display:inline-block;
  width:18px;
  height:15px;
  margin:0 9px;
  flex:0 0 18px;
  filter:drop-shadow(0 0 5px rgba(184,132,255,.72));
  animation:navBflyFloat 3.6s ease-in-out infinite;
}
.nav-butterfly i{
  position:absolute;
  display:block;
  width:8px;
  height:12px;
  top:1px;
  background:linear-gradient(135deg,#e5caff,#a978e8);
  border:1px solid rgba(255,255,255,.5);
}
.nav-butterfly i:first-child{
  left:0;
  border-radius:70% 35% 65% 45%;
  transform:rotate(28deg);
}
.nav-butterfly i:last-child{
  right:0;
  border-radius:35% 70% 45% 65%;
  transform:rotate(-28deg);
}
.nav-butterfly:after{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  width:2px;
  height:9px;
  border-radius:50%;
  background:#8f63c9;
  box-shadow:0 0 4px rgba(226,195,255,.9);
}
.nav-butterfly.right{animation-delay:1.5s}
@keyframes navBflyFloat{
  0%,100%{transform:translateY(1px) rotate(-5deg);opacity:.72}
  50%{transform:translateY(-4px) rotate(5deg);opacity:1}
}
@media(max-width:800px){
  .nav-butterfly{width:14px;height:12px;margin:0 5px;flex-basis:14px}
  .nav-butterfly i{width:6px;height:9px}
  .nav-butterfly:after{left:6px;top:3px;height:7px}
}
</style>
